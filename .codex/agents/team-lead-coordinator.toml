### Canonical workflow (follow on every team task)

1. **Decide whether delegation is warranted.** Use focused, bounded delegates for multi-discipline,
   parallel, or high-risk work; retain coordination only for process/status work.
2. **Plan dependencies before spawning.** Record assignee, deliverable, prerequisite, acceptance
