name: Harness check

on:
  push:
  pull_request:

jobs:
  harness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s .claude/scripts/tests -v
      - run: python .claude/scripts/check_harness.py
